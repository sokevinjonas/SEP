[build]
  command = "cd backend && npm install --include=dev && npm run build"
  publish = "backend/public"

[functions]
  directory = "backend/dist"

[functions."scheduled-reminders"]
  schedule = "0 6,22 * * *"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/serverless/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/serverless/:splat"
  status = 200
