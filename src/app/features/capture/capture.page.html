<ion-header class="ion-no-border">
  <ion-toolbar class="capture-toolbar">
    <ion-title class="page-title">Receipt &amp; MoMo Capture</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="capture-content">
  <div class="page-container has-bottom-bars">

    <p class="page-subtitle ion-text-center">Intelligent OCR scan &amp; secure storage</p>

    <!-- Upload Card (Official ion-card) -->
    <ion-card class="upload-tile ion-no-margin">
      <ion-card-content class="upload-card-content">
        <ion-avatar class="upload-avatar">
          <ion-icon name="cloud-upload-outline"></ion-icon>
        </ion-avatar>
        <ion-card-title class="upload-title">Import Receipt or MoMo Screenshot</ion-card-title>
        <p class="upload-desc">MTN Mobile Money, Telecel Cash or paper tickets</p>
      </ion-card-content>
    </ion-card>

    <!-- Info Note (Official ion-item) -->
    <ion-item lines="none" class="info-note-item">
      <ion-icon name="camera-outline" slot="start" class="info-icon"></ion-icon>
      <ion-label class="ion-text-wrap">
        Receipts captured offline are safely queued for background synchronization.
      </ion-label>
    </ion-item>

  </div>
</ion-content>
