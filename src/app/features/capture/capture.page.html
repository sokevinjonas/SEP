<ion-content [fullscreen]="true" class="capture-content">
  <div class="sep-page-container has-bottom-bars">
    <header class="sep-page-header">
      <h2 class="sep-page-title">Capture Reçu &amp; MoMo</h2>
      <p class="sep-page-subtitle">Scan OCR intelligent et stockage sécurisé R2</p>
    </header>

    <section class="upload-tile">
      <div class="upload-icon-circle">
        <ion-icon name="cloud-upload-outline"></ion-icon>
      </div>
      <h3 class="upload-title">Importer un reçu ou screenshot MoMo</h3>
      <p class="upload-desc">MTN Mobile Money, Vodafone Cash ou ticket papier</p>
    </section>

    <div class="info-note">
      <ion-icon name="camera-outline"></ion-icon>
      <span>Les captures prises hors-ligne sont mises en file d'attente automatique.</span>
    </div>
  </div>
</ion-content>
