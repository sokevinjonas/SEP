text-primary-container rounded-full hover:bg-surface-container active:scale-95 transition-all" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><img alt="Student Savings Logo" class="h-8 w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAXBhBMNSDSiDlwrHMCJ9cN2LLcdZYB1xbiIxm7aWvWwMDdikeBwwxfaiHOUM2wUBUySzvqHprOo3HtM7i8d2Pwi48BY-ZvKhlDKYrn3F7jjWq01WWYwhCknX_VOh1OiW5jcFlSuDSHNo0fD2bBK-yFStCIL_99IUMguEjvtFyE_Lk6vlvjgCPC0V3eKkupOycXgb_5WKJLC30Y7-UoCbZ7RgkHPCtCB8gLnL71OuNM0CI0W1-dAJ7l"/><h1 class="font-headline-md text-headline-md text-on-surface truncate">Transaction Detail</h1></div><div class="flex items-center gap-space-sm"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex-1 flex flex-col relative w-full pt-16 pb-safe bg-surface px-gutter"><div class="flex flex-col w-full pb-6 space-y-4">
<!-- Subtle Top Grabber Handle for Modal Feel -->
<div class="flex justify-center items-center pt-1 pb-1">
<div class="w-12 h-1.5 rounded-full bg-surface-variant"></div>
</div>
<!-- Header Card: Dismiss + Title + Currency Switcher -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm flex items-center justify-between">
<div class="flex items-center gap-3">
<button aria-label="Cancel log" class="w-9 h-9 rounded-full bg-surface-container flex items-center justify-center text-primary-container active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
<div>
<p class="font-headline-md text-headline-md text-on-surface">Quick Log Expense</p>
<p class="font-caption-sm text-caption-sm text-on-surface-variant">Tap, tag &amp; dash to class</p>
</div>
</div>
<!-- Dual Currency Pill Switcher -->
<div class="flex items-center bg-surface-container rounded-full p-0.5" id="currency-toggle">
<button class="px-2.5 py-1 rounded-full font-caption-currency text-caption-currency bg-primary-container text-on-primary transition-all shadow-sm" id="curr-ghs" onclick="switchCurrency('GHS')" type="button">
        GHS
      </button>
<button class="px-2.5 py-1 rounded-full font-caption-currency text-caption-currency text-on-surface-variant transition-all hover:text-on-surface" id="curr-xof" onclick="switchCurrency('XOF')" type="button">
        XOF
      </button>
</div>
</div>
<!-- Giant Interactive Balance Display & Micro Chips -->
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-sm text-center relative overflow-hidden">
<div class="absolute -right-6 -bottom-6 w-24 h-24 bg-surface-container-low rounded-full pointer-events-none opacity-60"></div>
<div class="absolute -left-6 -top-6 w-20 h-20 bg-secondary-fixed/20 rounded-full pointer-events-none opacity-40"></div>
<div class="flex items-center justify-center gap-1.5 mb-1">
<span class="font-caption-sm text-caption-sm text-on-surface-variant" id="rate-estimate">Daily campus allowance: GHS 45.00 left</span>
</div>
<!-- Live Numeric Output -->
<div class="py-2 flex items-baseline justify-center gap-2">
<span class="font-headline-lg text-headline-lg text-primary-container font-extrabold tracking-tight" id="currency-label">GHS</span>
<span class="font-display-hero-mobile text-display-hero-mobile text-primary-container font-extrabold tracking-tight select-none" id="amount-display">0.00</span>
</div>
<p class="font-caption-currency text-caption-currency text-on-surface-variant mb-4 tracking-wider" id="counterpart-conversion">
      ≈ 0 XOF (WEST AFRICAN CFA)
    </p>
<!-- Quick Incremental Chip Triggers -->
<div class="flex items-center justify-center gap-2 pt-1">
<button class="px-3.5 py-1.5 rounded-full bg-surface-container text-primary-container font-label-md text-label-md font-bold active:scale-95 hover:bg-surface-variant transition-all" onclick="addAmount(5)" type="button">
        +5
      </button>
<button class="px-3.5 py-1.5 rounded-full bg-surface-container text-primary-container font-label-md text-label-md font-bold active:scale-95 hover:bg-surface-variant transition-all" onclick="addAmount(10)" type="button">
        +10
      </button>
<button class="px-3.5 py-1.5 rounded-full bg-surface-container text-primary-container font-label-md text-label-md font-bold active:scale-95 hover:bg-surface-variant transition-all" onclick="addAmount(20)" type="button">
        +20
      </button>
<button class="px-3.5 py-1.5 rounded-full bg-surface-container text-primary-container font-label-md text-label-md font-bold active:scale-95 hover:bg-surface-variant transition-all" onclick="addAmount(50)" type="button">
        +50
      </button>
<button class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant hover:text-error active:scale-90 transition-all ml-1" onclick="clearAmount()" title="Reset" type="button">
<span class="material-symbols-outlined text-[16px]">restart_alt</span>
</button>
</div>
</div>
<!-- Category Selection Matrix -->
<div class="bg-surface-container-lowest rounded-xl p-4 shadow-sm">
<div class="flex items-center justify-between mb-3 px-1">
<span class="font-label-md text-label-md text-on-surface font-bold">Category</span>
<span class="font-caption-sm text-caption-sm text-on-surface-variant">Tap once to set</span>
</div>
<div class="grid grid-cols-3 gap-2.5" id="category-grid">
<!-- Food (Default Active) -->
<button class="cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-high text-primary-container shadow-sm transition-all active:scale-95" onclick="selectCategory(this, 'Food')" type="button">
<span class="text-2xl mb-1 select-none">🍲</span>
<span class="font-caption-sm text-caption-sm font-bold truncate">Food &amp; Chop</span>
</button>
<!-- Transport -->
<button class="cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95" onclick="selectCategory(this, 'Transport')" type="button">
<span class="text-2xl mb-1 select-none">🚌</span>
<span class="font-caption-sm text-caption-sm font-semibold truncate">Trotro / Ride</span>
</button>
<!-- Books & School -->
<button class="cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95" onclick="selectCategory(this, 'Books')" type="button">
<span class="text-2xl mb-1 select-none">📚</span>
<span class="font-caption-sm text-caption-sm font-semibold truncate">Handouts &amp; Books</span>
</button>
<!-- Social -->
<button class="cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95" onclick="selectCategory(this, 'Social')" type="button">
<span class="text-2xl mb-1 select-none">☕</span>
<span class="font-caption-sm text-caption-sm font-semibold truncate">Hangouts</span>
</button>
<!-- Utilities / Data -->
<button class="cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95" onclick="selectCategory(this, 'Utilities')" type="button">
<span class="text-2xl mb-1 select-none">💡</span>
<span class="font-caption-sm text-caption-sm font-semibold truncate">Data &amp; Power</span>
</button>
<!-- Other -->
<button class="cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95" onclick="selectCategory(this, 'Other')" type="button">
<span class="text-2xl mb-1 select-none">🏷️</span>
<span class="font-caption-sm text-caption-sm font-semibold truncate">Other</span>
</button>
</div>
</div>
<!-- Note / Campus Merchant Input with OCR Shortcut -->
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-sm flex items-center gap-3">
<div class="w-10 h-10 rounded-xl bg-surface-container flex items-center justify-center text-primary-container flex-shrink-0">
<span class="material-symbols-outlined text-[20px]">storefront</span>
</div>
<div class="flex-1 min-w-0">
<label class="block font-caption-currency text-caption-currency text-on-surface-variant uppercase" for="merchant-note">Merchant / Note</label>
<input class="w-full bg-transparent font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none truncate py-0.5" id="merchant-note" placeholder="e.g. Campus Cafeteria, Kaneshie Trotro" type="text"/>
</div>
<!-- Quick OCR / MoMo SMS Scan Icon -->
<button class="w-10 h-10 rounded-xl bg-secondary-container text-on-secondary-container flex items-center justify-center active:scale-95 transition-transform" onclick="triggerReceiptScan()" title="Scan receipt or MoMo SMS" type="button">
<span class="material-symbols-outlined text-[20px]">document_scanner</span>
</button>
</div>
<!-- Compact Non-Punitive Micro-Coach Card -->
<div class="bg-surface-container-high rounded-xl p-3.5 flex items-start gap-3">
<div class="w-8 h-8 rounded-full bg-surface-container-lowest flex items-center justify-center text-primary flex-shrink-0 shadow-sm mt-0.5">
<span class="material-symbols-outlined text-[18px]">verified</span>
</div>
<div class="flex-1 min-w-0">
<div class="flex items-center justify-between">
<p class="font-label-md text-label-md text-on-surface font-bold">Gentle Pace Check</p>
<span class="font-caption-currency text-caption-currency text-secondary font-bold">ON TRACK</span>
</div>
<p class="font-caption-sm text-caption-sm text-on-surface-variant mt-0.5">
        Logging under 15 GHS keeps dinner budget safe for Friday's study group.
      </p>
</div>
</div>
<!-- Tactile Numeric Keypad -->
<div class="bg-surface-container-lowest rounded-xl p-3 shadow-sm select-none">
<div class="grid grid-cols-3 gap-2">
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('1')" type="button">1</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('2')" type="button">2</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('3')" type="button">3</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('4')" type="button">4</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('5')" type="button">5</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('6')" type="button">6</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('7')" type="button">7</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('8')" type="button">8</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('9')" type="button">9</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('.')" type="button">.</button>
<button class="h-12 rounded-xl bg-surface-container-low text-on-surface font-headline-lg text-headline-lg font-bold active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('0')" type="button">0</button>
<button aria-label="Delete last digit" class="h-12 rounded-xl bg-surface-container-low text-primary-container active:bg-surface-container active:scale-95 transition-all flex items-center justify-center" onclick="pressKey('backspace')" type="button">
<span class="material-symbols-outlined text-[24px]">backspace</span>
</button>
</div>
</div>
<!-- Primary Save CTA (Thumb Zone anchor: 52px height, 20px pill, solid teal) -->
<div class="pt-1">
<button class="w-full h-[52px] rounded-full bg-secondary text-on-secondary font-headline-md text-headline-md font-bold shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2" id="save-btn" onclick="handleSaveExpense()" type="button">
<span class="material-symbols-outlined text-[22px]">check_circle</span>
<span>Save Expense (1 Tap)</span>
</button>
</div>
</div>
<script>
  let currentRawInput = '';
  let activeCurrency = 'GHS';
  let selectedCategory = 'Food';
  const FX_RATE = 42.5; // 1 GHS ≈ 42.5 XOF

  function updateDisplay() {
    const displayEl = document.getElementById('amount-display');
    const counterpartEl = document.getElementById('counterpart-conversion');

    let numericVal = parseFloat(currentRawInput);
    if (isNaN(numericVal) || numericVal <= 0) {
      displayEl.textContent = '0.00';
      counterpartEl.textContent = activeCurrency === 'GHS' 
        ? '≈ 0 XOF (WEST AFRICAN CFA)' 
        : '≈ 0.00 GHS (GHANAIAN CEDI)';
      return;
    }

    displayEl.textContent = numericVal.toFixed(2);

    if (activeCurrency === 'GHS') {
      const converted = Math.round(numericVal * FX_RATE);
      counterpartEl.textContent = `≈ ${converted.toLocaleString()} XOF (WEST AFRICAN CFA)`;
    } else {
      const convertedGhs = (numericVal / FX_RATE).toFixed(2);
      counterpartEl.textContent = `≈ ${convertedGhs} GHS (GHANAIAN CEDI)`;
    }
  }

  function pressKey(key) {
    if (key === 'backspace') {
      currentRawInput = currentRawInput.slice(0, -1);
    } else if (key === '.') {
      if (!currentRawInput.includes('.')) {
        currentRawInput = currentRawInput === '' ? '0.' : currentRawInput + '.';
      }
    } else {
      // Prevent more than 2 decimal digits
      const parts = currentRawInput.split('.');
      if (parts[1] && parts[1].length >= 2) return;
      if (currentRawInput.length >= 7) return; // reasonable max
      currentRawInput += key;
    }
    updateDisplay();
  }

  function addAmount(value) {
    let current = parseFloat(currentRawInput) || 0;
    current += value;
    currentRawInput = current.toFixed(2);
    updateDisplay();
  }

  function clearAmount() {
    currentRawInput = '';
    updateDisplay();
  }

  function switchCurrency(code) {
    activeCurrency = code;
    const btnGhs = document.getElementById('curr-ghs');
    const btnXof = document.getElementById('curr-xof');
    const labelEl = document.getElementById('currency-label');
    const estimateEl = document.getElementById('rate-estimate');

    if (code === 'GHS') {
      btnGhs.className = 'px-2.5 py-1 rounded-full font-caption-currency text-caption-currency bg-primary-container text-on-primary transition-all shadow-sm';
      btnXof.className = 'px-2.5 py-1 rounded-full font-caption-currency text-caption-currency text-on-surface-variant transition-all hover:text-on-surface';
      labelEl.textContent = 'GHS';
      estimateEl.textContent = 'Daily campus allowance: GHS 45.00 left';
    } else {
      btnXof.className = 'px-2.5 py-1 rounded-full font-caption-currency text-caption-currency bg-primary-container text-on-primary transition-all shadow-sm';
      btnGhs.className = 'px-2.5 py-1 rounded-full font-caption-currency text-caption-currency text-on-surface-variant transition-all hover:text-on-surface';
      labelEl.textContent = 'XOF';
      estimateEl.textContent = 'Daily allowance estimate: ~1,900 XOF left';
    }
    updateDisplay();
  }

  function selectCategory(btnElement, catName) {
    selectedCategory = catName;
    const allButtons = document.querySelectorAll('#category-grid .cat-pill');
    allButtons.forEach(btn => {
      btn.className = 'cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-low text-on-surface hover:bg-surface-container transition-all active:scale-95';
      const label = btn.querySelector('span:last-child');
      if (label) label.className = 'font-caption-sm text-caption-sm font-semibold truncate';
    });

    btnElement.className = 'cat-pill flex flex-col items-center justify-center p-3 rounded-xl bg-surface-container-high text-primary-container shadow-sm transition-all active:scale-95';
    const activeLabel = btnElement.querySelector('span:last-child');
    if (activeLabel) activeLabel.className = 'font-caption-sm text-caption-sm font-bold truncate';
  }

  function triggerReceiptScan() {
    const noteInput = document.getElementById('merchant-note');
    noteInput.value = 'Campus Canteen #4 (MoMo Verified)';
    currentRawInput = '14.50';
    updateDisplay();
  }

  function handleSaveExpense() {
    const saveBtn = document.getElementById('save-btn');
    const amountVal = parseFloat(currentRawInput) || 0;

    if (amountVal <= 0) {
      saveBtn.classList.add('bg-primary-container');
      saveBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">touch_app</span><span>Enter amount first</span>';
      setTimeout(() => {
        saveBtn.classList.remove('bg-primary-container');
        saveBtn.className = 'w-full h-[52px] rounded-full bg-secondary text-on-secondary font-headline-md text-headline-md font-bold shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2';
        saveBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>Save Expense (1 Tap)</span>';
      }, 1200);
      return;
    }

    saveBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">done_all</span><span>Logged to Ledger! ✨</span>';
    saveBtn.classList.remove('bg-secondary');
    saveBtn.classList.add('bg-primary-container');

    setTimeout(() => {
      currentRawInput = '';
      document.getElementById('merchant-note').value = '';
      updateDisplay();
      saveBtn.className = 'w-full h-[52px] rounded-full bg-secondary text-on-secondary font-headline-md text-headline-md font-bold shadow-md hover:opacity-95 active:scale-[0.98] transition-all flex items-center justify-center gap-2';
      saveBtn.innerHTML = '<span class="material-symbols-outlined text-[22px]">check_circle</span><span>Save Expense (1 Tap)</span>';
    }, 1100);
  }
</script></main></body></html>
