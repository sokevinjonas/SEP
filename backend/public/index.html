<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Savings API</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F7F3F6;
      color: #2B1F28;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EADFE7;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      box-shadow: 0 4px 16px rgba(113, 75, 103, 0.08);
      text-align: center;
    }
    h1 {
      font-size: 20px;
      color: #714B67;
      margin-top: 0;
    }
    p {
      font-size: 14px;
      color: #6B5966;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      background: #E8F5E9;
      color: #2E7D32;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    a {
      color: #017e84;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Online</div>
    <h1>Student Savings API</h1>
    <p>The backend service for Student Savings is active.</p>
    <p><a href="/api/health">Check Health Status (/api/health)</a></p>
  </div>
</body>
</html>
